name: Build Android APK (Offline DB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Bundle (Offline Device DB)
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./toko-app-offline.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: toko-app-offline-apk
          path: ./toko-app-offline.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "Toko App Android APK (Offline DB)"
          body: "Download file **toko-app-offline.apk** di bawah ini untuk menginstal aplikasi Toko App di perangkat Android (100% Offline dengan Database Lokal)."
          files: ./toko-app-offline.apk
          prerelease: false
